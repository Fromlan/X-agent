<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-agent</title>
    <style>
      /* ===== 调色板:贴合 Cindy default-dark 主题,#141414 底 + 近单色 ===== */
      :root {
        color-scheme: dark;
        --bg: #141414;
        --bg-soft: #181b24;   /* 中心高光,差值 ≤8%,克制 */
        --bg-edge: #0a0c12;   /* 边缘更暗 */
        --board: #3c3c3a;     /* 1px 细边 */
        --board-soft: #2a2a28;
        --text-1: #e6e6e4;
        --text-2: #a3a3a3;
        --text-3: #737373;
        --text-4: #525252;
        --accent: #417cdd;    /* 唯一允许的色相:logo 高光与进度条 */
        --accent-soft: rgba(65, 124, 221, 0.45);
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 窗口已设 transparent:true,这里也必须透明,否则 OS 会按 body 底色绘实心窗口。 */
        background: transparent;
        color: var(--text-1);
        font-family:
          "Inter", system-ui, -apple-system, "Segoe UI",
          "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
        font-feature-settings: "ss01", "cv11";
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        user-select: none;
        -webkit-app-region: drag;
        opacity: 1;
        transition: opacity 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      body.leaving {
        opacity: 0;
      }

      .inner {
        position: relative;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 26px 32px 22px;
        /* 中心微高光,营造"舞台"感;亮度差 ≤8%,不抢戏 */
        background:
          radial-gradient(
            ellipse 78% 60% at 50% 42%,
            var(--bg-soft) 0%,
            var(--bg) 55%,
            var(--bg-edge) 100%
          );
        /* 关键:HTML 自绘圆角。配合 transparent:true 窗口,真实呈现圆角外形。 */
        border-radius: 20px;
        /* 缩进 8px 给 ::after 阴影留出空间 */
        margin: 8px;
        width: calc(100% - 16px);
        height: calc(100% - 16px);
      }
      /* 系统 hasShadow 关闭后,用 CSS 阴影补一点浮起感(在 .inner 外侧一圈) */
      .inner::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 24px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        z-index: -1;
      }

      /* 1px 细边 + 内边距 1px 形成双层描边的精致感 */
      .frame {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border: 1px solid var(--board);
        border-radius: inherit;
      }

      /* logo 后方柔和蓝色光晕:在容器内绝对定位,只占中心区域 */
      .halo {
        position: absolute;
        top: 32%;
        left: 50%;
        width: 220px;
        height: 220px;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle at center,
          rgba(65, 124, 221, 0.22) 0%,
          rgba(65, 124, 221, 0.08) 38%,
          transparent 70%
        );
        filter: blur(8px);
        pointer-events: none;
        z-index: 0;
      }

      /* 顶部与底部的微弱光带,呼应 logo 金属银反光 */
      .shine {
        position: absolute;
        left: 50%;
        width: 60%;
        height: 1px;
        transform: translateX(-50%);
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.06) 50%,
          transparent 100%
        );
        pointer-events: none;
        z-index: 0;
      }
      .shine.top { top: 22px; }
      .shine.bottom { bottom: 22px; }

      /* ===== 主体元素 ===== */
      .mark {
        position: relative;
        z-index: 1;
        width: 88px;
        height: 88px;
        border-radius: 22px;
        padding: 1px;
        /* 渐变描边:从冷蓝到亮银白,模拟 logo 的金属高光 */
        background: linear-gradient(
          135deg,
          rgba(120, 150, 200, 0.35) 0%,
          rgba(200, 215, 235, 0.55) 45%,
          rgba(120, 150, 200, 0.18) 100%
        );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          inset 0 -1px 0 rgba(0, 0, 0, 0.4);
      }
      .mark::before {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: 21px;
        background: linear-gradient(
          180deg,
          #1a1d24 0%,
          #13151a 100%
        );
        z-index: 0;
      }
      .mark img {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 20px;
        object-fit: cover;
      }

      .title {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.18em;
        color: var(--text-1);
        /* 极轻的文字光晕,呼应金属高光 */
        text-shadow: 0 0 12px rgba(180, 200, 230, 0.08);
      }
      .title .sep {
        display: inline-block;
        margin: 0 0.42em;
        color: var(--text-4);
        font-weight: 400;
      }

      .slogan {
        position: relative;
        z-index: 1;
        margin: 0;
        max-width: 280px;
        font-size: 12px;
        line-height: 1.55;
        text-align: center;
        color: var(--text-2);
        letter-spacing: 0.01em;
      }

      /* 进度条 + 脉冲点,替代原来单纯的三点呼吸 */
      .progress {
        position: relative;
        z-index: 1;
        margin-top: 6px;
        width: 132px;
        height: 2px;
        border-radius: 9999px;
        background: var(--board-soft);
        overflow: hidden;
      }
      .progress-bar {
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 9999px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--accent) 50%,
          transparent 100%
        );
        box-shadow: 0 0 6px var(--accent-soft);
        animation: progress-slide 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes progress-slide {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(310%); }
      }

      /* 底部 meta 行:点 + 状态 + 版本号 */
      .meta {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 2px;
        font-size: 11px;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
      }
      .meta .dots {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        height: 6px;
      }
      .meta .dot {
        width: 3px;
        height: 3px;
        border-radius: 9999px;
        background: var(--accent);
        opacity: 0.4;
        animation: dot-pulse 1.4s ease-in-out infinite;
      }
      .meta .dot:nth-child(2) { animation-delay: 0.2s; }
      .meta .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes dot-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.85); }
        50%      { opacity: 1;    transform: scale(1.15); }
      }
      .meta .status {
        color: var(--text-2);
        letter-spacing: 0.02em;
      }
      .meta .version {
        color: var(--text-4);
        font-feature-settings: "tnum";
      }
      .meta .divider {
        display: inline-block;
        width: 1px;
        height: 10px;
        background: var(--board);
      }

      .credit {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: 10.5px;
        color: var(--text-4);
        letter-spacing: 0.04em;
      }
      .credit span {
        color: var(--text-3);
        font-weight: 500;
      }

      /* ===== 入场:错峰上浮,加细微缩放,营造"逐项点亮" ===== */
      .fade {
        opacity: 0;
        transform: translateY(6px);
        animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .mark.fade {
        transform: scale(0.92) translateY(4px);
        animation-duration: 0.55s;
        animation-delay: 0.04s;
      }
      .title.fade     { animation-delay: 0.16s; }
      .slogan.fade    { animation-delay: 0.28s; }
      .progress.fade  { animation-delay: 0.40s; }
      .meta.fade      { animation-delay: 0.52s; }
      .credit.fade    { animation-delay: 0.62s; }
      .halo, .shine   {
        opacity: 0;
        animation: halo-in 0.9s ease-out 0.1s forwards;
      }
      @keyframes fade-up {
        to { opacity: 1; transform: none; }
      }
      @keyframes halo-in {
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        body { transition: none; }
        .fade,
        .halo,
        .shine,
        .progress-bar,
        .dot {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="inner">
      <span class="frame" aria-hidden="true"></span>
      <span class="halo" aria-hidden="true"></span>
      <span class="shine top" aria-hidden="true"></span>
      <span class="shine bottom" aria-hidden="true"></span>

      <div class="mark fade">
        <img src="./logo.png" alt="" width="88" height="88" />
      </div>
      <p class="title fade">X<span class="sep">·</span>agent</p>
      <p class="slogan fade">为 Godot 创作而生的桌面 Agent</p>

      <div class="progress fade" aria-hidden="true">
        <span class="progress-bar"></span>
      </div>

      <div class="meta fade" aria-label="启动状态">
        <span class="dots" aria-hidden="true">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
        <span class="status">正在准备会话资源</span>
        <span class="divider" aria-hidden="true"></span>
        <span class="version">v0.5.3</span>
      </div>

      <p class="credit fade">by <span>Fromlan</span></p>
    </div>
  </body>
</html>
