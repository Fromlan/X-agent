name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0 or v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      # fetch-depth: 0 ensures git tag/diff operations see the full history
      # (e.g. for scripts that compare against the previous tag).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci

      - name: Resolve version
        id: version
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $requested = if ($env:RELEASE_EVENT -eq 'workflow_dispatch') { $env:REQUESTED_VERSION } else { $env:GITHUB_REF_NAME }
          $env:RELEASE_VERSION = $requested
          node scripts/validate-release.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $requested -creplace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build release notes from CHANGELOG
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/extract-changelog.mjs "$RELEASE_VERSION" \
            --fail-empty \
            --out "$RUNNER_TEMP/release-notes.md"
          echo "---- release notes ----"
          cat "$RUNNER_TEMP/release-notes.md"

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:e2e
      - name: Install verified Godot 4.6.2
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: ./scripts/setup-godot.ps1
      - run: npm run test:godot
      - name: Validate changelog extraction
        shell: bash
        working-directory: ${{ github.workspace }}
        run: node scripts/test-extract-changelog.mjs
      # Optional Windows code signing: set repository secrets CSC_LINK + CSC_KEY_PASSWORD
      # (or WIN_CSC_LINK). electron-builder signs automatically when present.
      - run: npm run dist
      - name: Include verified notes
        shell: pwsh
        run: Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'release-notes.md') -Destination 'release/release-notes.md'

      # Upload permission is granted only to a separate job after every check and build succeeds.
      - uses: actions/upload-artifact@v6
        with:
          name: verified-release
          path: |
            apps/desktop/release/X-agent-Setup-*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
            apps/desktop/release/release-notes.md
          if-no-files-found: error
    outputs:
      tag: ${{ steps.version.outputs.tag }}

  publish:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: verified-release
          path: verified-release
      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: X-agent ${{ needs.release.outputs.tag }}
          body_path: verified-release/release-notes.md
          generate_release_notes: false
          files: |
            verified-release/X-agent-Setup-*.exe
            verified-release/*.blockmap
            verified-release/*.yml
