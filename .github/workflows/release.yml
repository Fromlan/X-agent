name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0 or v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Expose optional Gitee token at job scope so steps can gate on `env`
    # (GitHub rejects `secrets.*` inside step-level `if` expressions).
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci

      - name: Resolve version
        id: version
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync package.json version
        shell: bash
        run: npm pkg set "version=${{ steps.version.outputs.version }}"

      - name: Build release notes from CHANGELOG
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/extract-changelog.mjs "${{ steps.version.outputs.version }}" \
            --fail-empty \
            --out "$RUNNER_TEMP/release-notes.md"
          echo "---- release notes ----"
          cat "$RUNNER_TEMP/release-notes.md"

      - run: npm run typecheck
      - run: npm test
      # Optional Windows code signing: set repository secrets CSC_LINK + CSC_KEY_PASSWORD
      # (or WIN_CSC_LINK). electron-builder signs automatically when present.
      - run: npm run dist

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: X-agent ${{ steps.version.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml

      - name: Sync Gitee Release
        if: env.GITEE_TOKEN != ''
        # GitHub Release is already published; keep the overall job green if Gitee flakes.
        continue-on-error: true
        env:
          GITEE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          node scripts/sync-gitee-release.mjs "${{ steps.version.outputs.version }}" apps/desktop/release
