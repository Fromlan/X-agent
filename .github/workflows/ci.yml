name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  # 同一 ref 的旧运行自动取消,避免堆积占资源
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    # 校验 .github/workflows/*.yml 自身语法 + 字段拼写，零依赖、毫秒级
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          level: error

  desktop:
    runs-on: windows-latest
    needs: actionlint
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

  unit-test:
    # ROADMAP 1.1 —— Vitest 单元测试 + 覆盖率门槛（与 desktop job 并行）
    runs-on: windows-latest
    needs: actionlint
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  e2e:
    # ROADMAP 1.1 —— Playwright E2E（构建后启动 Electron，跑壳渲染 + 模式切换契约）
    runs-on: windows-latest
    needs: actionlint
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # 缓存 Playwright 浏览器,避免每次重下
      - name: Playwright Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/desktop/package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
