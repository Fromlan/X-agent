name: Bug report
description: Report something that is broken or behaving incorrectly
title: "[bug] <short summary>"
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in the sections below so the
        maintainer can reproduce and fix it. If the report is
        security-sensitive, see [`SECURITY.md`](../../SECURITY.md) and
        email [fromlan@qq.com](mailto:fromlan@qq.com) instead of opening
        an issue.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, one-paragraph summary of the bug.
      placeholder: |
        When I open a Godot 4 project that uses autoloads, X-agent shows
        the autoload list as empty after editing `project.godot`.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce. Include any sample project
        state if relevant.
      placeholder: |
        1. Open a Godot 4.5 project with one autoload (`res://autoload/Game.gd`)
        2. Set `godot_set_project_setting("autoload/Game", "*res://autoload/Game.gd")` …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages,
        screenshots, or log output.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: X-agent version
      description: From `apps/desktop/package.json` `version` field, or
        the About dialog.
      placeholder: "0.5.3"
    validations:
      required: true

  - type: input
    id: godot
    attributes:
      label: Godot version (if relevant)
      placeholder: "4.5.1"
  - type: input
    id: model
    attributes:
      label: Model provider / model (if relevant)
      placeholder: "anthropic / claude-3-7-sonnet"

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant log lines or attach screenshots. For
        dev builds, set `X_AGENT_DEBUG=1` and include the
        `getStartupReport` output.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Workarounds you've tried, related issues, etc.
    validations:
      required: false
