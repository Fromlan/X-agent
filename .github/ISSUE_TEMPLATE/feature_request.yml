name: Feature request
description: Suggest a new capability or change to existing behavior
title: "[feat] <short summary>"
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Feature requests work best when they describe the **problem** first
        and the proposed **solution** second. The maintainer triages weekly
        — see [`MAINTENANCE.md`](../../MAINTENANCE.md).

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Frame it from the user's perspective. What is hard /
        annoying / impossible today?
      placeholder: |
        Today I have to manually copy a `godot://` path into the chat
        composer to share a Godot resource with the agent. This breaks my
        flow when I'm in the editor and want to ask "why is this node
        behaving like this?".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Sketch the UI / API if
        you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, and why you
        prefer the proposed one.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, mockups, related issues.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: Please confirm this fits the project's goals.
      options:
        - label: This does not duplicate an existing issue
          required: true
        - label: This is not a security issue (use SECURITY.md if it is)
          required: true
        - label: This fits within the project's "What it is / What it is
            not" positioning in the README
          required: true
